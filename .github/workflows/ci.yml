name: ci

on: [push, pull_request]

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Typecheck
        run: mypy agent/
      - name: Unit + regression tests
        run: pytest tests/ -v

  # Golden-path browser test (server/tests_e2e/). Deliberately in the always-run tier, not
  # gated like `evals` below — agent/llm.py is stubbed for determinism, so it needs no
  # DASHSCOPE_API_KEY and costs nothing. Spins up its own in-process uvicorn + in-memory
  # SQLite (see tests_e2e/conftest.py); no docker-compose/postgres needed.
  e2e-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[e2e]"
      - run: playwright install --with-deps chromium
      - name: Golden-path E2E (web app + simulated device API)
        run: pytest tests_e2e/ -v

  # Evals hit the DashScope API, so they are a separate job: they need a secret and they
  # cost money. They still block the merge — see spec §8.3/§8.4 thresholds.
  evals:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: server
    env:
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Golden boxes + intent/refusal evals
        run: pytest ../evals -v --eval

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests + lint
        working-directory: android
        run: ./gradlew testDebugUnitTest lint

  # Compose/Espresso instrumented tests (android/app/src/androidTest) — proves the
  # button-tap -> Room-write and C2/C3 screen wiring on an actual running Android system.
  # ★ Explicitly NOT a substitute for physical-device testing: an emulator cannot reproduce
  # OEM background-process-killing (spec §4, CLAUDE.md's #1 technical risk) — see
  # docs/testing/manual_e2e.md for the physical Huawei/Honor/Xiaomi procedure that is.
  android-instrumented:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run instrumented tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          working-directory: android
          api-level: 30
          target: default
          arch: x86_64
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest
