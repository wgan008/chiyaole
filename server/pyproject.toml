[project]
name = "chiyaole-server"
version = "0.1.0"
description = "ChiYaoLe server — medication adherence for elderly users in mainland China"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "apscheduler>=3.10,<4",
    "httpx>=0.27",
    "pypinyin>=0.51",
    "oss2>=2.18",
    "dashscope>=1.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "pyyaml>=6.0",
    "types-PyYAML",
    "freezegun>=1.5",
]
# Separate from `dev`: pulls a real Chromium binary (`playwright install chromium`), which
# `make install` shouldn't force on everyone just to run `make unit`.
e2e = [
    "pytest-playwright>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "eval: hits a live model API; only runs with --eval",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "B008",   # FastAPI Depends() in defaults is the documented idiom
    "UP042",  # agent/types.py: str+Enum over StrEnum is deliberate, keeps agent/ importable on 3.10
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
disallow_untyped_defs = true
ignore_missing_imports = true
